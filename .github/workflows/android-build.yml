name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SAKURA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SAKURA_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.SAKURA_S3_BUCKET }}
          AWS_REGION: ${{ secrets.SAKURA_AWS_REGION }}
        run: |
          aws s3 cp app/build/outputs/apk/debug/app-debug.apk \
            s3://$S3_BUCKET/builds/${{ github.run_id }}/app-debug.apk \
            --region $AWS_REGION